<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>16pro 控肉飯</title>
  <style>
    body {
      margin: 0;
      font-family: "Noto Sans TC", Arial, sans-serif;
      background: #fff8ef;
      color: #2b1b12;
    }

    .hero {
      min-height: 100vh;
      padding: 40px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(180deg, #fff1dc, #fff8ef);
    }

    .card {
      max-width: 760px;
      background: white;
      padding: 48px 28px;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(80, 40, 10, 0.15);
    }

    .tag {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 1880px;
      background: #2b1b12;
      color: white;
      font-size: 14px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 44px;
      margin: 0 0 12px;
      letter-spacing: 1px;
    }

    h2 {
      font-size: 26px;
      margin: 0 0 24px;
      color: #8a3d16;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
      margin: 12px 0;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      margin: 28px 0;
    }

    .button {
      display: inline-block;
      margin-top: 24px;
      padding: 16px 32px;
      background: #8a3d16;
      color: white;
      text-decoration: none;
      border-radius: 999px;
      font-size: 20px;
      font-weight: bold;
    }

    .section {
      padding: 64px 24px;
      max-width: 900px;
      margin: auto;
    }

    .section h3 {
      font-size: 30px;
      margin-bottom: 16px;
    }

    .info {
      background: white;
      border-radius: 24px;
      padding: 28px;
      margin-top: 24px;
      box-shadow: 0 12px 40px rgba(80, 40, 10, 0.08);
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      color: #8a6a55;
      font-size: 14px;
    }
    .banner{
    overflow:hidden;
    background:#111;
    padding:18px 0;
}

.banner-track{
    display:flex;
    width:max-content;
    animation:scroll 25s linear infinite;
}

.banner img{
    width:320px;
    height:220px;
    object-fit:cover;
    border-radius:18px;
    margin:0 12px;
    flex-shrink:0;
}

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-50%);
    }

}
  </style>
</head>

<body>
  
<section class="banner">

</html>
